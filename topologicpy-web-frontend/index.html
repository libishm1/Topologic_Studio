<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="description"
      content="Topologic Studio - IFC viewer, egress graph and fire simulation."
    />
    <title>Topologic Studio</title>
    <script>
      // Apply the stored theme before first paint so the app never flashes the
      // wrong background while React boots.
      (function () {
        try {
          var stored = localStorage.getItem("ts.theme");
          if (stored === "light" || stored === "dark") {
            document.documentElement.dataset.theme = stored;
          }
        } catch (e) {
          /* private mode: fall back to the media query */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
