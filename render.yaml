# Render blueprint for the Topologic Studio backend.
#
# Since 2026-10-27 the Next line is on main, so the existing service,
# topologicstudio-backend (created with Classic, default region Oregon), runs
# it and redeploys on every push to main, together with the Pages frontend
# (.github/workflows/deploy-frontend.yml). Classic is tagged
# classic-2026-10-27 for a rollback: push that tag to main.
#
# Speed, in order of how much each one matters. Measured 2026-10-27 from the
# lab network against the live Classic service (free plan, default region):
#   1. plan - first request after idling: 33.1 s, because the free plan sleeps
#      after 15 idle minutes. A route query computes in ~7 ms; the wake is
#      four orders of magnitude longer. `starter` never sleeps.
#      The free plan's 750 instance-hours are per workspace: keeping both
#      Classic and Next awake with an uptime pinger needs ~1,490 h a month and
#      runs out mid-month.
#   2. region - warm /health took 0.31 s against Render's default region
#      (Oregon). TCP round trip to Oregon measured 225-290 ms, to Frankfurt
#      ~90 ms, and that difference lands on every request. Region is fixed
#      when the service is created and cannot be changed afterwards.
services:
  - type: web
    name: topologicstudio-backend
    runtime: docker
    rootDir: topologicpy-web-backend
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: CORS_ORIGINS
        value: https://libishm1.github.io
      - key: PERF_LOG
        value: "0"
      - key: GRAPH_CACHE_SIZE
        value: "8"
      - key: GRAPH_TTL_SECONDS
        value: "3600"

# A faster home, when wanted: a second service in Frankfurt (about 150 ms less
# per request from the lab than Oregon). Region is fixed at creation, so it
# is a new service, created from the dashboard; point the repository variable
# VITE_API_BASE at it and the next Pages build uses it.
