name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'topologicpy-web-frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  # A deploy that fails for GitHub's reasons (a Pages timeout) can be run
  # again from the Actions tab without a source change.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: topologicpy-web-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: topologicpy-web-frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        env:
          BASE_PATH: '/${{ github.event.repository.name }}/'
          VITE_API_BASE: ${{ vars.VITE_API_BASE || 'https://topologicstudio-backend.onrender.com' }}
          # The Cloudflare describer's address (cloudflare/describe-worker); empty until it is deployed.
          VITE_DESCRIBE_URL: ${{ vars.DESCRIBE_URL || '' }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY || '' }}
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: topologicpy-web-frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Pages usually takes under a minute; on 2026-11-09 it took more than
          # the default 10 minutes once and the release failed. Wait up to 20.
          timeout: 1200000
