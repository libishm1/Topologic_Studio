name: Backend image

# Builds the backend image the way Render builds it (the Dockerfile in
# topologicpy-web-backend), starts it, and checks it answers with the
# TopologicPy kernel loaded. The development machine has no Docker, so this is
# where the Render image is verified. Builds and runs only: nothing is pushed
# to a registry and nothing is deployed.

on:
  push:
    branches: [main, next/studio-2, next/browser-core]
    paths:
      - 'topologicpy-web-backend/**'
      - '.github/workflows/backend-image.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t studio-backend topologicpy-web-backend

      - name: Size
        run: |
          size=$(docker image inspect studio-backend --format '{{.Size}}')
          echo "Image size: $((size / 1024 / 1024)) MiB" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Start and probe
        run: |
          start=$(date +%s.%N)
          docker run -d --name api -p 8000:8000 studio-backend
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/health > /dev/null && break
            sleep 0.5
          done
          ready=$(date +%s.%N)
          printf 'Container start to healthy: %.1f s\n' "$(echo "$ready - $start" | bc)" | tee -a "$GITHUB_STEP_SUMMARY"
          curl -sf http://127.0.0.1:8000/api/capabilities > capabilities.json
          python3 - <<'EOF'
          import json
          caps = json.load(open("capabilities.json"))
          print(json.dumps({k: caps[k] for k in ("version", "engines", "navigation_check")}))
          assert "topologicpy" in caps["engines"], "TopologicPy engine not usable in the image"
          assert caps["navigation_check"], "Navigation cross-check not available in the image"
          EOF

      - name: Tests inside the image
        run: |
          docker run --rm -v "$PWD/topologicpy-web-backend/tests:/app/tests:ro" studio-backend \
            sh -c "pip install -q pytest httpx && python -m pytest -q -p no:cacheprovider tests"

      - name: Container log
        if: always()
        run: docker logs api || true
